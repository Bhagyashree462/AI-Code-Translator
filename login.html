<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeMorph AI - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-card glass-card">
    <h2>🤖 CodeMorph AI</h2>
    <h3>Welcome Back</h3>
    <p>Sign in to access your translation dashboard</p>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="input-field">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="developer@example.com" required />
      </div>

      <div class="input-field">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn-primary">Sign In & Open Dashboard 🚀</button>
    </form>

    <p class="auth-redirect">
      Don't have an account? <a href="index.html">Register here</a>
    </p>
  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();
      
      // Save authenticated session token/flag
      localStorage.setItem('isAuthenticated', 'true');
      
      // REDIRECT TO STEP 3: DASHBOARD
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
