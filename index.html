<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join CodeMorph AI</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">

  <div class="auth-card">
    
    <!-- Glowing Robot Logo -->
    <div class="bot-icon-wrapper">
      <div class="bot-glow"></div>
      <div class="bot-icon">🤖</div>
    </div>

    <!-- Headers -->
    <h2>Join <span>CodeMorph AI</span></h2>
    <p class="subtitle">Create your AI Workspace</p>

    <!-- Registration Form -->
    <form id="registerForm" onsubmit="handleRegistration(event)">
      
      <div class="input-group">
        <span class="input-icon">👤</span>
        <input type="text" id="fullName" placeholder="Full Name" required />
      </div>

      <div class="input-group">
        <span class="input-icon">✉️</span>
        <input type="email" id="email" placeholder="Email" required />
      </div>

      <div class="input-group">
        <span class="input-icon">🔒</span>
        <input type="password" id="password" placeholder="Password" required />
      </div>

      <button type="submit" class="btn-cyan">➔ Create Account</button>
    </form>

    <p class="footer-text">
      Already have an account? <a href="login.html">Login</a>
    </p>

  </div>

  <script>
    function handleRegistration(event) {
      event.preventDefault();
      // Store flag for registration
      localStorage.setItem('userRegistered', 'true');
      // Redirect to Login Page
      window.location.href = 'login.html';
    }
  </script>

</body>
</html>
