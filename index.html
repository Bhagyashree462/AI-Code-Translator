<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeMorph AI - Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-card glass-card">
    <h2>🤖 CodeMorph AI</h2>
    <h3>Create Account</h3>
    <p>Register to start translating code across languages</p>

    <form id="registerForm" onsubmit="handleRegistration(event)">
      <div class="input-field">
        <label>Full Name</label>
        <input type="text" id="regName" placeholder="John Doe" required />
      </div>

      <div class="input-field">
        <label>Email Address</label>
        <input type="email" id="regEmail" placeholder="developer@example.com" required />
      </div>

      <div class="input-field">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn-primary">Create Account & Continue ➔</button>
    </form>

    <p class="auth-redirect">
      Already have an account? <a href="login.html">Login here</a>
    </p>
  </div>

  <script>
    function handleRegistration(event) {
      event.preventDefault();
      
      // Save state to indicate registration is completed
      localStorage.setItem('userRegistered', 'true');
      
      // REDIRECT TO STEP 2: LOGIN
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
